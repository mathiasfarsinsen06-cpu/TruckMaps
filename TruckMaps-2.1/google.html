<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TruckMaps – Google kort</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#edf2f7}#gmap{position:fixed;inset:0}header{position:absolute;z-index:2;top:12px;left:12px;width:min(340px,calc(100% - 24px));background:white;padding:14px;border-radius:20px;box-shadow:0 3px 14px #0003}input,button,a{font:inherit;padding:10px;border-radius:12px;margin:4px 0}input{width:100%;border:1px solid #aaa}button,a{background:#1769d2;color:white;border:0;display:inline-block;text-decoration:none;cursor:pointer}small{display:block;color:#555}</style><div id="gmap"></div><header><a href="index.html">← Lastbilkort</a><h2 style="margin:6px 0">Google kort</h2><label>Google Maps Demo Key<input id="gkey" type="password" autocomplete="off"></label><button id="save">Gem nøgle</button><button id="forget">Glem nøgle</button><button id="load">Vis Google kort</button><div><button data-type="roadmap">Kort</button> <button data-type="satellite">Satellit</button> <button data-type="hybrid">Hybrid</button> <button data-type="terrain">Terræn</button></div><button id="gps">Min position</button><small id="msg" role="status">Separat kortvisning – ingen lastbilruter på Google-kortet. Nøglen kan gemmes lokalt.</small></header><script>let g,loading=false,failed=false,renderTimer;const el=id=>document.getElementById(id),msg=t=>el('msg').textContent=t;window.gm_authFailure=()=>{failed=true;clearTimeout(renderTimer);msg('Google afviste nøglen. Kontrollér adgang og begrænsninger.');};window.initTruckGoogle=()=>{try{g=new google.maps.Map(el('gmap'),{center:{lat:56.1,lng:10.2},zoom:7,mapTypeId:'roadmap',streetViewControl:false,mapTypeControl:false,fullscreenControl:false,zoomControl:true});if(!failed){msg('Kort initialiseret. Venter på kortbilleder…');google.maps.event.addListenerOnce(g,'tilesloaded',()=>{clearTimeout(renderTimer);if(!failed)msg('Kortbilleder indlæst. Vælg Satellit.');});renderTimer=setTimeout(()=>{if(!failed)msg('Ingen kortbilleder modtaget. Kontrollér Console (F12), nøgle og internet.');},20000);}}catch(e){msg('Google kort kunne ikke initialiseres.');}finally{loading=false;}};el('load').onclick=()=>{if(g||loading)return msg('Genindlæs siden for at prøve en anden nøgle.');let k=el('gkey').value.trim();if(!k)return msg('Indsæt Google-nøglen først.');loading=true;let s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?'+new URLSearchParams({key:k,callback:'initTruckGoogle',loading:'async',language:'da'});s.async=true;s.onerror=()=>{loading=false;msg('Google kunne ikke indlæses.');s.remove()};document.head.append(s);msg('Henter Google kort…');};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>g?g.setMapTypeId(b.dataset.type):msg('Indlæs kortet først.'));let dot;el('gps').onclick=()=>{if(!g)return msg('Indlæs kortet først.');if(!navigator.geolocation)return msg('GPS er ikke tilgængelig.');msg('Finder position…');navigator.geolocation.getCurrentPosition(p=>{let c={lat:p.coords.latitude,lng:p.coords.longitude};g.setCenter(c);g.setZoom(17);if(dot)dot.setMap(null);dot=new google.maps.Circle({map:g,center:c,radius:Math.max(3,p.coords.accuracy),fillColor:'#4285f4',fillOpacity:.2,strokeColor:'#4285f4'});msg('Position fundet. Præcision ca. '+Math.round(p.coords.accuracy)+' m.');},e=>msg('GPS-fejl '+e.code+' – '+e.message),{enableHighAccuracy:false,timeout:30000,maximumAge:60000});};el('save').onclick=()=>{let k=el('gkey').value.trim();if(!k)return msg('Indsæt Google-nøglen først.');try{localStorage.setItem('truckmaps-google-key',k);if(!g&&!loading)el('load').click();else msg('Nøgle gemt. Genindlæs siden for at bruge den.');}catch(e){msg('Browseren kunne ikke gemme nøglen.');}};el('forget').onclick=()=>{localStorage.removeItem('truckmaps-google-key');location.reload()};try{let saved=localStorage.getItem('truckmaps-google-key');if(saved){el('gkey').value=saved;el('load').click();}}catch(e){msg('Kunne ikke læse gemt nøgle.');}</script></html>
